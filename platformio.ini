[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; ---- Flash layout: 4M2M (2 MB sketch / 2 MB filesystem) ----
; Matches Tasmota's `tasmota-4M` env so the two firmwares can cross-flash
; over OTA. The linker script defines _FS_start=0x40400000, giving the
; same 2 MB sketch region (0x40200000..0x40400000) and 2 MB FS that
; Tasmota uses for its ESP8266 4M builds.
board_build.ldscript = eagle.flash.4m2m.ld
board_build.flash_size = 4MB
board_build.f_cpu = 160000000L
; Same SPI flash mode as Tasmota's ESP8266 4M builds -> full parity for
; cross-flashing (also relevant if the chip is programmed fresh over serial).
board_build.flash_mode = dout

; Upload firmware over the serial board. For OTA upload use:
;   platformio run -t upload --upload_port 172.217.28.1 --upload_protocol espota
upload_protocol = espota
upload_port = 172.217.28.1

; No debug output (serial monitor not part of the project). LOW_MEMORY_LOW_FLASH
; lwIP variant disables unused TCP/IP features (NAPT, reassembly, forwarding,...)
; and reduces the stack's RAM + flash footprint.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=128
    ; ST7735_GREENTAB128 maps a full 128x128 panel 1:1 to CGRAM in rotation 3
    ; (colstart=0, rowstart=0, MADCTL MX|MV|RGB) with no pixel offset.
    ; GREENTAB3's colstart=1 makes a 128-wide CASET land on GRAM 1..128, so the
    ; last column wraps back to column 0 -> left edge reappears on the right.
    -DST7735_GREENTAB128=1
    ; GREENTAB3 defaults to BGR order; this panel needs RGB (red showed as
    ; purple, blue as pale blue with the default).
    -DTFT_RGB_ORDER=1
    ; 27 MHz is the speed TFT_eSPI documents as reliable for ST7735: the
    ; fast-path pushPixels at 40 MHz produced periodic lost pixels (vertical
    ; black stripes) and a marginal right-edge GRAM column (green line).
    -DSPI_FREQUENCY=27000000
    ; Pin mapping (Wemos D1 Mini) matching the original wiring:
    ; D7=SDI(MOSI)=13, D5=SCK=14, D8=CS=15, D3=D/C=0, RST tied to 3V3
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD

; bitbank2 JPEG encoder: writes RGB565 directly from the shared frame buffer.
; Vendored into lib/JPEGENC and patched for ESP8266: the tables that are read
; with l8ui/l16ui loads (hufftable, quant_*, huffl_*, cZigZag*) were moved out
; of PROGMEM into RAM, because an ESP8266 can only read flash via aligned l32i.
; The 32-bit-read tables (ulMagnitudeFix, iScaleBits) stay in PROGMEM flash.
lib_deps =
    adafruit/Adafruit AMG88xx Library@^1.3.2
    bodmer/TFT_eSPI@^2.5.0
